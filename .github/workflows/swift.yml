# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - uses: actions/checkout@v3
    - name: Build
      run: swift build -v
    - name: Build and test
      run: swift test -v --parallel --enable-test-discovery
      # Live emulator suites are gated on TREZOR_EMULATOR / LEDGER_EMULATOR and skipped here.

  # Linux is not supported: the Keystone transport ships an iOS-only XCFramework
  # (URRegistryFFI) and the Ledger BLE transport targets iOS/macOS only.
